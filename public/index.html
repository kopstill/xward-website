<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xward: Count down to anything</title>
<meta name="description" content="Xward is an iPhone countdown app. It tells you how many days are left, and how many of them you actually have to work. Coming soon.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="canonical" href="https://xward.app/">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --page: #F5F5F7;
    --ink: #1D1D1F;
    --muted: #6E6E73;
    --hairline: rgba(0, 0, 0, .1);
    --glass: rgba(255, 255, 255, .7);
    --frame: #1D1D1F;
    --frame-edge: #48484A;
    --phone-shadow: rgba(60, 30, 40, .24);
    /* The app's retirement gradient, its first stop deepened to keep 3:1 on the light page. */
    --accent: linear-gradient(100deg, #E85A24, #EA5550 55%, #DE457A);
    --glow-a: rgba(255, 181, 71, .42);
    --glow-b: rgba(222, 69, 122, .24);
    --dot: #86868B;
    /* Tall enough to fill the window, leaving room for the caption and dots. */
    --phone-height: min(100vh - 160px, 860px);
    --phone-width: calc(var(--phone-height) * .46);
    --gutter: clamp(24px, 5vw, 72px);
  }

  @supports (height: 1svh) {
    :root { --phone-height: min(100svh - 160px, 860px); }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000;
      --ink: #F5F5F7;
      --muted: #A1A1A6;
      --hairline: rgba(255, 255, 255, .16);
      --glass: rgba(44, 44, 46, .7);
      --frame: #1C1C1E;
      --frame-edge: #545458;
      --phone-shadow: rgba(0, 0, 0, .6);
      --accent: linear-gradient(100deg, #F0682C, #EA5550 55%, #DE457A);
      --glow-a: rgba(240, 104, 44, .3);
      --glow-b: rgba(222, 69, 122, .26);
      --dot: #636366;
    }
  }

  * { box-sizing: border-box; margin: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }

  main {
    position: relative;
    /* Shrink to the text and the phone, so the page's two side margins match. */
    width: fit-content;
    min-height: 100vh;
    min-height: 100svh;
    margin-inline: auto;
    padding-inline: var(--gutter);
    display: grid;
    grid-template-columns: minmax(0, min(45vw, 54rem)) var(--phone-width);
    column-gap: clamp(48px, 7vw, 128px);
    align-items: center;
  }

  .brand {
    position: absolute;
    top: clamp(24px, 4.5vh, 44px);
    left: var(--gutter);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -.02em;
  }

  .intro { padding: 88px 0 72px; }

  h1 {
    font-size: clamp(2.75rem, 6.4vw, 8.5rem);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -.028em;
  }

  h1 span {
    background: var(--accent);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .pitch {
    margin-top: clamp(20px, 2.4vw, 32px);
    max-width: 29em;
    color: var(--muted);
    font-size: clamp(1.0625rem, 1.55vw, 1.75rem);
    line-height: 1.45;
    text-wrap: balance;
  }

  .soon {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: clamp(28px, 3vw, 40px);
    padding: .7em 1.25em .7em 1em;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--glass);
    font-size: clamp(1rem, 1.2vw, 1.25rem);
    font-weight: 600;
  }

  .soon::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }

  .facts {
    margin-top: 16px;
    color: var(--muted);
    font-size: clamp(.9375rem, 1.05vw, 1.125rem);
  }

  .gallery {
    position: relative;
    min-width: 0;
    padding-block: 32px 16px;
    display: grid;
    /* Fixed to the phone's width, so the wider caption can't push the phone sideways. */
    grid-template-columns: 100%;
    justify-items: center;
    isolation: isolate;
  }

  .gallery::before {
    content: "";
    position: absolute;
    z-index: -1;
    /* Spreads past the phone, but no further than the page's margin. */
    inset: 4% max(-24%, -1 * var(--gutter)) 16%;
    background:
      radial-gradient(closest-side at 62% 34%, var(--glow-a), transparent),
      radial-gradient(closest-side at 40% 68%, var(--glow-b), transparent);
    filter: blur(48px);
  }

  .phone {
    position: relative;
    width: var(--phone-width);
    padding: calc(var(--phone-width) * .028);
    border-radius: calc(var(--phone-width) * .168);
    background: var(--frame);
    box-shadow:
      inset 0 0 0 1px var(--frame-edge),
      0 36px 72px -18px var(--phone-shadow),
      0 10px 24px -10px var(--phone-shadow);
  }

  /* The side buttons: the action button and volume on the left, power on the right. */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    width: 2px;
    background: var(--frame-edge);
  }

  .phone::before {
    right: 100%;
    top: 16%;
    height: 5%;
    border-radius: 2px 0 0 2px;
    box-shadow:
      0 calc(var(--phone-width) * .2) var(--frame-edge),
      0 calc(var(--phone-width) * .37) var(--frame-edge);
  }

  .phone::after {
    left: 100%;
    top: 26%;
    height: 10%;
    border-radius: 0 2px 2px 0;
  }

  .screen {
    position: relative;
    overflow: hidden;
    aspect-ratio: 402 / 874;
    border-radius: calc(var(--phone-width) * .14);
    background: var(--page);
  }

  /* Simulator screenshots leave the Dynamic Island's space empty. */
  .screen::after {
    content: "";
    position: absolute;
    top: 1.26%;
    left: 34.35%;
    width: 31.3%;
    aspect-ratio: 126 / 37;
    border-radius: 999px;
    background: #000;
    pointer-events: none;
  }

  .track {
    position: relative;
    display: flex;
    height: 100%;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    outline-offset: -4px;
  }

  .track::-webkit-scrollbar { display: none; }
  .track.dragging { cursor: grabbing; scroll-snap-type: none; }

  .slide {
    flex: none;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .slide img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
  }

  .caption {
    /* Wider than the phone; the grid centers it, so it overhangs both sides evenly. */
    width: 26rem;
    margin-top: 24px;
    color: var(--muted);
    font-size: .9375rem;
    line-height: 1.35;
    text-align: center;
    text-wrap: balance;
  }

  .dots {
    display: flex;
    margin-top: 4px;
  }

  .dots button {
    display: grid;
    place-items: center;
    width: 28px;
    height: 44px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }

  .dots button::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--dot);
    transition: width .25s;
  }

  .dots button[aria-current="true"]::before {
    width: 20px;
    background: var(--accent);
  }

  .fineprint {
    position: absolute;
    bottom: clamp(20px, 3.5vh, 36px);
    left: var(--gutter);
    color: var(--muted);
    font-size: .8125rem;
  }

  /* The side margins get too thin for the overhang, so long captions wrap. Two lines keep the dots in place. */
  @media (max-width: 1099px) {
    .caption {
      width: calc(var(--phone-width) + 2 * var(--gutter));
      min-height: 2.7em;
    }
  }

  @media (max-width: 899px) {
    /* The page scrolls here, so the phone sizes to the width instead of the height. */
    :root {
      --phone-width: min(80vw, 340px);
      --gutter: 24px;
    }

    main { display: block; width: auto; }
    .brand { position: static; padding-top: 24px; }
    .intro { padding: 40px 0 0; }
    .gallery { padding-block: 40px 0; }
    .gallery::before { inset: 0 -24px 12%; }
    .fineprint { position: static; display: block; padding-block: 8px 28px; text-align: center; }
  }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }

    .intro > *, .gallery {
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) backwards;
    }

    .pitch { animation-delay: .06s; }
    .soon { animation-delay: .12s; }
    .facts { animation-delay: .18s; }
    .gallery { animation-delay: .1s; }
  }
</style>
</head>
<body>
<main>
  <p class="brand"><img src="logo.svg" width="36" height="36" alt="">Xward</p>

  <section class="intro">
    <h1>Count down to <span>anything.</span></h1>
    <p class="pitch">Your retirement, your next trip, the weekend. Xward tells you how many days are left, and how many of them you actually have to work.</p>
    <p class="soon">Coming soon to iPhone</p>
    <p class="facts">Free to download. No ads.</p>
  </section>

  <section class="gallery" aria-label="App screenshots">
    <div class="phone">
      <div class="screen">
        <div class="track" tabindex="0">
          <figure class="slide" data-caption="Pin the big one. The rest line up by date.">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="screens/home-dark.jpg">
              <img src="screens/home.jpg" width="804" height="1748" draggable="false" alt="The Xward home screen: a large orange card reads 1,195 workdays left until retirement, above cards for the weekend, a birthday, a flight, and a trip.">
            </picture>
          </figure>
          <figure class="slide" data-caption="Retirement in workdays, Mondays, and paydays.">
            <img src="screens/retirement.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="A retirement countdown showing 1,195 workdays left, 83% of a career done, 234 Mondays, 123 paydays, and a timeline of milestones.">
          </figure>
          <figure class="slide" data-caption="Weekends, public holidays, and your days off don’t count.">
            <img src="screens/vacation.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="A countdown to a Japan trip showing 26 workdays left out of 40 days.">
          </figure>
          <figure class="slide" data-caption="Seven templates, or any date you like.">
            <img src="screens/templates.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="The New Countdown screen listing seven templates: retirement, vacation, holiday, weekend, birthday, anniversary, and custom.">
          </figure>
          <figure class="slide" data-caption="Light or dark, it follows your iPhone.">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="screens/home.jpg">
              <img src="screens/home-dark.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="The Xward home screen in the opposite appearance: dark on a light page, light on a dark page.">
            </picture>
          </figure>
        </div>
      </div>
    </div>
    <p class="caption" aria-live="polite"></p>
    <div class="dots">
      <button type="button" aria-label="Home screen"></button>
      <button type="button" aria-label="Retirement countdown"></button>
      <button type="button" aria-label="Trip countdown"></button>
      <button type="button" aria-label="Templates"></button>
      <button type="button" aria-label="Light and dark appearance"></button>
    </div>
  </section>

  <small class="fineprint">© 2026 Xward</small>
</main>

<script>
  const track = document.querySelector(".track");
  const slides = [...track.children];
  const caption = document.querySelector(".caption");
  const dots = [...document.querySelectorAll(".dots button")];
  const scrollBehavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

  const nearestIndex = () => Math.round(track.scrollLeft / track.clientWidth);
  const show = (index) => track.scrollTo({ left: slides[index].offsetLeft, behavior: scrollBehavior });

  let current = -1;
  function render() {
    const index = nearestIndex();
    if (index === current) return;
    current = index;
    caption.textContent = slides[index].dataset.caption;
    dots.forEach((dot, i) => dot.setAttribute("aria-current", i === index));
  }

  let frame = 0;
  const scheduleRender = () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(render);
  };
  track.addEventListener("scroll", scheduleRender, { passive: true });
  addEventListener("resize", scheduleRender);
  render();

  dots.forEach((dot, i) => dot.addEventListener("click", () => show(i)));

  // Touch and trackpads scroll natively; a mouse drags the track.
  let drag = null;
  let snapTimer = 0;
  track.addEventListener("pointerdown", (event) => {
    if (event.pointerType !== "mouse" || event.button !== 0) return;
    clearTimeout(snapTimer);
    drag = { x: event.clientX, moved: false };
    track.setPointerCapture(event.pointerId);
  });
  track.addEventListener("pointermove", (event) => {
    if (!drag) return;
    // The button can be released where no pointerup reaches this page, such as in another tab.
    if (!(event.buttons & 1)) {
      endDrag();
      return;
    }
    if (!drag.moved) {
      if (Math.abs(event.clientX - drag.x) < 4) return;
      // Measure from here: a smooth scroll may have moved the track since the press.
      drag = { x: event.clientX, left: track.scrollLeft, moved: true };
      track.classList.add("dragging");
    }
    track.scrollLeft = drag.left - (event.clientX - drag.x);
  });
  function endDrag() {
    if (!drag) return;
    drag = null;
    show(nearestIndex());
    // Snapping waits for the smooth scroll, so the slide doesn't jump into place.
    snapTimer = setTimeout(() => track.classList.remove("dragging"), 450);
  }
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);
  track.addEventListener("lostpointercapture", endDrag);
</script>
</body>
</html>
