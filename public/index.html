<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xward: Count down to anything</title>
<meta name="description" content="Xward is an iPhone countdown app. It tells you how many days are left, and how many of them you actually have to work. Coming soon.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="canonical" href="https://xward.app/">
<link rel="icon" href="data:,">
<style>
  :root {
    --page: #F5F5F7;
    --ink: #1D1D1F;
    --muted: #6E6E73;
    --hairline: rgba(0, 0, 0, .1);
    --glass: rgba(255, 255, 255, .7);
    --frame: #1D1D1F;
    --frame-edge: #48484A;
    --phone-shadow: rgba(60, 30, 40, .24);
    /* The app's retirement gradient, its first stop deepened to keep 3:1 on the light page. */
    --accent: linear-gradient(100deg, #E85A24, #EA5550 55%, #DE457A);
    --glow-a: rgba(255, 181, 71, .42);
    --glow-b: rgba(222, 69, 122, .24);
    --phone-height: min(70vh, 680px);
    --phone-width: calc(var(--phone-height) * .46);
    --gutter: clamp(24px, 7vw, 112px);
  }

  @supports (height: 1svh) {
    :root { --phone-height: min(70svh, 680px); }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000;
      --ink: #F5F5F7;
      --muted: #A1A1A6;
      --hairline: rgba(255, 255, 255, .16);
      --glass: rgba(44, 44, 46, .7);
      --frame: #1C1C1E;
      --frame-edge: #545458;
      --phone-shadow: rgba(0, 0, 0, .6);
      --accent: linear-gradient(100deg, #F0682C, #EA5550 55%, #DE457A);
      --glow-a: rgba(240, 104, 44, .3);
      --glow-b: rgba(222, 69, 122, .26);
    }
  }

  * { box-sizing: border-box; margin: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }

  main {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    align-items: center;
  }

  .brand {
    position: absolute;
    top: clamp(24px, 4.5vh, 44px);
    left: var(--gutter);
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -.02em;
  }

  .intro { padding: 88px 32px 72px var(--gutter); }

  h1 {
    font-size: clamp(2.75rem, 5vw, 5.25rem);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -.028em;
  }

  h1 span {
    background: var(--accent);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .pitch {
    margin-top: clamp(20px, 2.4vw, 32px);
    max-width: 29em;
    color: var(--muted);
    font-size: clamp(1.0625rem, 1.35vw, 1.3125rem);
    line-height: 1.45;
    text-wrap: pretty;
  }

  .soon {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: clamp(28px, 3vw, 40px);
    padding: 11px 20px 11px 16px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--glass);
    font-size: 1rem;
    font-weight: 600;
  }

  .soon::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }

  .facts {
    margin-top: 16px;
    color: var(--muted);
    font-size: .9375rem;
  }

  .gallery {
    position: relative;
    min-width: 0;
    isolation: isolate;
  }

  .gallery::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 4% 8% 14%;
    background:
      radial-gradient(closest-side at 62% 34%, var(--glow-a), transparent),
      radial-gradient(closest-side at 40% 68%, var(--glow-b), transparent);
    filter: blur(48px);
  }

  .track {
    display: flex;
    gap: clamp(16px, 2vw, 32px);
    padding: 44px calc(50% - var(--phone-width) / 2) 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    outline-offset: -4px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 96px);
    mask-image: linear-gradient(to right, transparent, #000 96px);
  }

  .track::-webkit-scrollbar { display: none; }
  .track.dragging { cursor: grabbing; scroll-snap-type: none; }

  .slide {
    --distance: 0;
    flex: none;
    width: var(--phone-width);
    scroll-snap-align: center;
  }

  .phone {
    padding: calc(var(--phone-width) * .028);
    border-radius: calc(var(--phone-width) * .168);
    background: var(--frame);
    box-shadow:
      inset 0 0 0 1px var(--frame-edge),
      0 28px 56px -14px var(--phone-shadow);
    transform: scale(calc(1 - .08 * var(--distance)));
  }

  .screen {
    position: relative;
    overflow: hidden;
    aspect-ratio: 402 / 874;
    border-radius: calc(var(--phone-width) * .14);
    background: var(--page);
  }

  /* Simulator screenshots leave the Dynamic Island's space empty. */
  .screen::after {
    content: "";
    position: absolute;
    top: 1.26%;
    left: 34.35%;
    width: 31.3%;
    aspect-ratio: 126 / 37;
    border-radius: 999px;
    background: #000;
  }

  .screen img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
  }

  figcaption {
    min-height: 2.7em;
    margin-top: 20px;
    color: var(--muted);
    font-size: .9375rem;
    line-height: 1.35;
    text-align: center;
    text-wrap: balance;
    opacity: calc(1 - var(--distance));
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding-bottom: 24px;
  }

  .controls button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    background: var(--glass);
    color: var(--ink);
    cursor: pointer;
    transition: opacity .2s;
  }

  .controls button:disabled { opacity: .3; cursor: default; }

  .fineprint {
    position: absolute;
    bottom: clamp(20px, 3.5vh, 36px);
    left: var(--gutter);
    color: var(--muted);
    font-size: .8125rem;
  }

  @media (hover: none) {
    .controls { display: none; }
  }

  @media (max-width: 899px) {
    :root {
      --phone-height: min(66vh, 600px);
      --gutter: 24px;
    }

    @supports (height: 1svh) {
      :root { --phone-height: min(66svh, 600px); }
    }

    main { display: block; }
    .brand { position: static; display: block; padding: 24px var(--gutter) 0; }
    .intro { padding: 40px var(--gutter) 0; }
    .track { padding-top: 40px; -webkit-mask-image: none; mask-image: none; }
    .gallery::before { inset: 0 0 12%; }
    .fineprint { position: static; display: block; padding: 8px var(--gutter) 28px; text-align: center; }
  }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }

    .intro > *, .gallery {
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) backwards;
    }

    .pitch { animation-delay: .06s; }
    .soon { animation-delay: .12s; }
    .facts { animation-delay: .18s; }
    .gallery { animation-delay: .1s; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">Xward</p>

  <section class="intro">
    <h1>Count down to <span>anything.</span></h1>
    <p class="pitch">Your retirement, your next trip, the weekend. Xward tells you how many days are left, and how many of them you actually have to work.</p>
    <p class="soon">Coming soon to iPhone</p>
    <p class="facts">Free to download. No ads.</p>
  </section>

  <section class="gallery" aria-label="App screenshots">
    <div class="track" tabindex="0">
      <figure class="slide">
        <div class="phone"><div class="screen"><img src="screens/home.jpg" width="804" height="1748" draggable="false" alt="The Xward home screen: a large orange card reads 1,195 workdays left until retirement, above cards for the weekend, a birthday, a flight, and a trip."></div></div>
        <figcaption>Pin the big one. The rest line up by date.</figcaption>
      </figure>
      <figure class="slide">
        <div class="phone"><div class="screen"><img src="screens/retirement.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="A retirement countdown showing 1,195 workdays left, 83% of a career done, 234 Mondays, 123 paydays, and a timeline of milestones."></div></div>
        <figcaption>Retirement in workdays, Mondays, and paydays.</figcaption>
      </figure>
      <figure class="slide">
        <div class="phone"><div class="screen"><img src="screens/vacation.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="A countdown to a Japan trip showing 26 workdays left out of 40 days."></div></div>
        <figcaption>Weekends, public holidays, and your days off don’t count.</figcaption>
      </figure>
      <figure class="slide">
        <div class="phone"><div class="screen"><img src="screens/templates.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="The New Countdown screen listing seven templates: retirement, vacation, holiday, weekend, birthday, anniversary, and custom."></div></div>
        <figcaption>Seven templates, or any date you like.</figcaption>
      </figure>
      <figure class="slide">
        <div class="phone"><div class="screen"><img src="screens/home-dark.jpg" width="804" height="1748" draggable="false" loading="lazy" alt="The Xward home screen in dark mode, with bright colored numbers on black."></div></div>
        <figcaption>Just as good after dark.</figcaption>
      </figure>
    </div>
    <div class="controls">
      <button type="button" aria-label="Previous screenshot"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5"/></svg></button>
      <button type="button" aria-label="Next screenshot"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 3.5 5.5 5.5L7 14.5"/></svg></button>
    </div>
  </section>

  <small class="fineprint">© 2026 Xward</small>
</main>

<script>
  const track = document.querySelector(".track");
  const slides = [...track.querySelectorAll(".slide")];
  const [previous, next] = document.querySelectorAll(".controls button");
  const scrollBehavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

  const centered = (slide) => slide.offsetLeft + slide.offsetWidth / 2 - track.clientWidth / 2;
  const nearestIndex = () => {
    const distances = slides.map((slide) => Math.abs(centered(slide) - track.scrollLeft));
    return distances.indexOf(Math.min(...distances));
  };
  const show = (index) => {
    const slide = slides[Math.max(0, Math.min(slides.length - 1, index))];
    track.scrollTo({ left: centered(slide), behavior: scrollBehavior });
  };

  // Slides shrink and lose their caption as they leave the center.
  function render() {
    const spacing = slides[1].offsetLeft - slides[0].offsetLeft;
    for (const slide of slides) {
      const distance = Math.min(1, Math.abs(centered(slide) - track.scrollLeft) / spacing);
      slide.style.setProperty("--distance", distance.toFixed(3));
    }
    previous.disabled = track.scrollLeft <= 1;
    next.disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 1;
  }

  let frame = 0;
  const scheduleRender = () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(render);
  };
  track.addEventListener("scroll", scheduleRender, { passive: true });
  addEventListener("resize", scheduleRender);
  render();

  previous.addEventListener("click", () => show(nearestIndex() - 1));
  next.addEventListener("click", () => show(nearestIndex() + 1));

  // Touch and trackpads scroll natively; a mouse drags the track, and a click brings a slide to the center.
  let drag = null;
  let snapTimer = 0;
  track.addEventListener("pointerdown", (event) => {
    if (event.pointerType !== "mouse" || event.button !== 0) return;
    clearTimeout(snapTimer);
    drag = { x: event.clientX, moved: false };
    track.setPointerCapture(event.pointerId);
  });
  track.addEventListener("pointermove", (event) => {
    if (!drag) return;
    // The button can be released where no pointerup reaches this page, such as in another tab.
    if (!(event.buttons & 1)) {
      endDrag();
      return;
    }
    if (!drag.moved) {
      if (Math.abs(event.clientX - drag.x) < 4) return;
      // Measure from here: a smooth scroll may have moved the track since the press.
      drag = { x: event.clientX, left: track.scrollLeft, moved: true };
      track.classList.add("dragging");
    }
    track.scrollLeft = drag.left - (event.clientX - drag.x);
  });
  function endDrag(clickedSlide = null) {
    if (!drag) return;
    const { moved } = drag;
    drag = null;
    show(!moved && clickedSlide ? slides.indexOf(clickedSlide) : nearestIndex());
    // Snapping waits for the smooth scroll, so the slide doesn't jump into place.
    snapTimer = setTimeout(() => track.classList.remove("dragging"), 450);
  }
  track.addEventListener("pointerup", (event) => {
    const hit = document.elementFromPoint(event.clientX, event.clientY);
    endDrag(hit?.closest(".slide"));
  });
  track.addEventListener("pointercancel", () => endDrag());
  track.addEventListener("lostpointercapture", () => endDrag());
</script>
</body>
</html>
